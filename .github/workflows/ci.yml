name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build leadtype
        run: bun run --filter leadtype build

      # The `leadtype` workspace bin symlinks only after dist exists, so the
      # first install (pre-build) skips it. Re-install to link the CLI before
      # invoking it the way a consumer would (`leadtype lint`).
      - name: Link CLI
        run: bun install

      # Dogfood our own CI feature: lint this repo's docs with the exact
      # command we recommend in docs/pipeline/validate-in-ci.mdx.
      - name: Validate docs (leadtype lint)
        run: bun x leadtype lint docs --format github --error-unknown --max-warnings 0

      # Doctor is read-only, so it is safe to gate on: it never clones,
      # refreshes, writes, or generates. Exit 1 means a required input is
      # missing or invalid — a broken config, a page declaring a group nothing
      # declares, a collection pointing at a directory that isn't there.
      #
      # Only this repo's own docs are gated. The example apps pin the current
      # git branch as their source ref, so their caches are stale by design on
      # any branch that hasn't synced, and gating on that reports the CI
      # environment rather than the config.
      - name: Diagnose project (leadtype doctor)
        run: bun x leadtype doctor --src . --docs-dir docs

      - name: Lint
        run: bun run --filter leadtype lint

      - name: Type check
        run: bun run --filter leadtype check-types

      - name: Test
        run: bun run --filter leadtype test

      # The deterministic half of the activation evals: the shipped skill
      # description must keep naming the authoring verbs and repository
      # signals, and stay under the discovery cap. `--filter leadtype` selects
      # the package named `leadtype`, so this workspace needs its own step or
      # the guard against a narrowed description never actually runs.
      - name: Test evals
        run: bun run --filter leadtype-evals test

  example-builds:
    name: Build examples
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and link leadtype
        run: |
          bun run --filter leadtype build
          bun install

      - name: Build Astro example
        run: bun run --filter astro-example build

      - name: Build SvelteKit example
        run: bun run --filter sveltekit-example build

      - name: Check generated files are ignored
        shell: bash
        run: |
          untracked="$(git ls-files --others --exclude-standard)"
          if [[ -n "$untracked" ]]; then
            printf 'Build left untracked files:\n%s\n' "$untracked"
            exit 1
          fi

  # Every Windows bug so far lived in runtime behavior or test assertions,
  # not the build — so this job must run the test suite, not just compile.
  validate-windows:
    name: Validate & test on Windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build leadtype
        run: bun run --filter leadtype build

      - name: Link CLI
        run: bun install

      - name: Validate docs (leadtype lint)
        run: bun x leadtype lint docs --format github --error-unknown --max-warnings 0

      - name: Test
        run: bun run --filter leadtype test
